name: SQL Logex Tests
defaults:
  run:
    shell: bash
    working-directory: ./sql_logex
on:
  pull_request:
    paths:
      - "sql_logex/**"
      - ".github/workflows/sql_logex_tests.yml"

  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  tests:
    name: Tests & Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup elixir
        id: beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: 28.5.0.4 # Define the OTP version [required]
          elixir-version: 1.19.5 # Define the elixir version [required]
      - name: Cache Mix
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            sql_logex/deps
            sql_logex/_build
          key: ${{ github.workflow }}-${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('sql_logex/mix.lock') }}
          restore-keys: |
            ${{ github.workflow }}-${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Install dependencies
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Run tests
        run: mix test --warnings-as-errors
      - name: Run format check
        run: mix format --check-formatted

  # The tests tagged :postgres, against the plain Postgres of sql_logex/compose.yml. The fixtures
  # test is excluded on 14, which has no fixture.
  postgres:
    name: Tests against Postgres ${{ matrix.postgres }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "17"]
    env:
      # Service postgres<major> listens on port 54<major>, see compose.yml
      SQL_LOGEX_DATABASE_URL: postgres://postgres:postgres@localhost:54${{ matrix.postgres }}/sql_logex_test
      SQL_LOGEX_REPORT: "1"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start Postgres
        run: docker compose up -d --wait --wait-timeout 120 postgres${{ matrix.postgres }}
      - name: Setup elixir
        id: beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: 28.5.0.4 # Define the OTP version [required]
          elixir-version: 1.19.5 # Define the elixir version [required]
      - name: Cache Mix
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            sql_logex/deps
            sql_logex/_build
          key: ${{ github.workflow }}-${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('sql_logex/mix.lock') }}
          restore-keys: |
            ${{ github.workflow }}-${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Install dependencies
        run: mix deps.get
      # All the tests, not --only postgres: an include wins over the exclusion of the fixtures test
      - name: Run tests
        run: mix test --warnings-as-errors
