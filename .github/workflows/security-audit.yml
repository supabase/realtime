name: Security Advisories

# Runs mix hex.audit outside of PR gating so a newly published CVE never
# blocks unrelated PRs. Deliberately never triggered by pull_request: that keeps
# SLACK_ALERTS_WEBHOOK out of reach of forked-repo runs.
# Scheduled so advisories are caught even when mix.lock hasn't
# changed, not just on push.
on:
  push:
    branches:
      - main
    paths:
      - "mix.lock"
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

# don't run 2 of the same runs at the same time, makes no sense
concurrency:
  group: security-audit

permissions:
  contents: read

jobs:
  hex-audit:
    name: Hex Audit
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup elixir
        id: beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: 28.5.0.4
          elixir-version: 1.19.5
      - name: Cache Mix
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ github.workflow }}-${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ github.workflow }}-${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Install dependencies
        run: mix deps.get
      - name: Run hex audit
        id: audit
        run: |
          # Human readable run for the job log, it also decides whether the job fails.
          status=0
          mix hex.audit > audit.log 2>&1 || status=$?
          cat audit.log

          if [ "$status" -ne 0 ]; then
            # The SARIF report only contains findings that are not ignored (see
            # ignore_advisories in mix.exs), so the notification only has actionable ones.
            mix hex.audit --format sarif --output audit.sarif || true

            # One Slack section per finding. Compact JSON is a single line, so it is safe to
            # write as a plain `name=value` output.
            blocks=""
            if [ -s audit.sarif ]; then
              blocks="$(jq -c --argjson max 40 '
                # Slack mrkdwn treats & < > as control characters
                def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
                def severity: if . >= 9 then "CRITICAL" elif . >= 7 then "HIGH" elif . >= 4 then "MEDIUM" else "LOW" end;
                .runs[0] as $run
                | ($run.tool.driver.rules | map({key: .id, value: .}) | from_entries) as $rules
                | [ $run.results[]
                    | ($rules[.ruleId].properties["security-severity"]) as $score
                    | if $score != null then
                        .message.arguments as [$pkg, $version, $advisory, $title, $url]
                        | "*\($pkg) \($version)* - <\($url)|\($advisory | esc)> (\($score | tonumber | severity))\n\($title | esc | .[0:2000])"
                      else
                        (.message.text | esc | .[0:2900])
                      end
                    | { type: "section", text: { type: "mrkdwn", text: . } } ]
                # Slack allows 50 blocks per message, the rest of the message needs a few
                | if length > $max then
                    .[0:$max] + [{ type: "context", elements: [{ type: "mrkdwn", text: "...and \(length - $max) more, see the run log" }] }]
                  else . end
              ' audit.sarif || true)"
            fi

            # No SARIF (e.g. the registry could not be fetched): show the plain log instead
            # of a notification without any information.
            if [ -z "$blocks" ] || [ "$blocks" = "[]" ]; then
              blocks="$(sed 's/\x1b\[[0-9;]*m//g' audit.log \
                | jq -Rsc '[{ type: "section", text: { type: "mrkdwn", text: ("```" + (gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;") | .[0:2900]) + "```") } }]')"
            fi
            echo "blocks=${blocks}" >> "$GITHUB_OUTPUT"
          fi

          exit "$status"
    outputs:
      blocks: ${{ steps.audit.outputs.blocks }}

  notify-slack:
    name: Notify Slack
    needs: hex-audit
    if: always() && needs.hex-audit.result == 'failure'
    uses: ./.github/workflows/slack-notify.yml
    with:
      title: 'Hex Audit'
      status: 'failure'
      # blocks is unset when the job failed before the audit step, slack-notify needs valid JSON
      details_blocks: ${{ needs.hex-audit.outputs.blocks || '[]' }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
