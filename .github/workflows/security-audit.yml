name: Security Advisories

# Runs mix hex.audit outside of PR gating so a newly published CVE never
# blocks unrelated PRs. Deliberately never triggered by pull_request: that keeps
# SLACK_ALERTS_WEBHOOK out of reach of forked-repo runs.
# Scheduled so advisories are caught even when mix.lock hasn't
# changed, not just on push.
on:
  push:
    branches:
      - main
    paths:
      - "mix.lock"
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

# don't run 2 of the same runs at the same time, makes no sense
concurrency:
  group: security-audit

permissions:
  contents: read

jobs:
  hex-audit:
    name: Hex Audit
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup elixir
        id: beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: 28.5.0.4
          elixir-version: 1.19.5
      - name: Cache Mix
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ github.workflow }}-${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ github.workflow }}-${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Install dependencies
        run: mix deps.get
      - name: Run hex audit
        id: audit
        run: |
          set -o pipefail
          status=0
          mix hex.audit 2>&1 | tee audit.log || status=$?

          # Ignored advisories (see ignore_advisories in mix.exs) are printed in their own
          # section, drop it so the notification only contains what is actionable. A section
          # ends at the next non-indented line. ANSI codes are stripped for Slack.
          details="$(sed 's/\x1b\[[0-9;]*m//g' audit.log \
            | awk '/^Ignored advisories:/ { skip=1; next } /^[^ \t]/ { skip=0 } !skip' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')"

          # A multiline value in $GITHUB_OUTPUT ends at the first line equal to the delimiter.
          # Advisory text is third-party content: with a fixed delimiter, a line matching it
          # would end the value early and the remainder would be parsed as further outputs.
          # A delimiter that is random per run can't be guessed, so that can't happen.
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "details<<${delimiter}"
            echo "$details"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

          exit "$status"
    outputs:
      details: ${{ steps.audit.outputs.details }}

  notify-slack:
    name: Notify Slack
    needs: hex-audit
    if: always() && needs.hex-audit.result == 'failure'
    uses: ./.github/workflows/slack-notify.yml
    with:
      title: 'Hex Audit'
      status: 'failure'
      details: ${{ needs.hex-audit.outputs.details }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
