name: PR title

# semantic-release reads the squash commit message, which comes from the PR
# title. Retitle PRs we can infer a type for, then fail the check for the rest.
#
# pull_request_target so fork PRs get a token that can edit the title. It runs
# the workflow and script from the base branch and never checks out PR code.
# The title, branch and commit messages are untrusted: only pass them as data.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  retitle:
    name: Retitle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Default ref under pull_request_target is the base branch, not the PR head.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Edits made with GITHUB_TOKEN don't trigger new workflow runs, so this can't loop.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { proposeTitle } = require("./.github/scripts/semantic_pr_title.js");
            const pull_number = context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number });
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo,
              pull_number,
              per_page: 100,
            });

            const title = proposeTitle({
              title: pr.title,
              branch: pr.head.ref,
              commitSubjects: commits
                .filter((commit) => commit.parents.length < 2)
                .map((commit) => commit.commit.message.split("\n")[0]),
            });

            if (!title) {
              core.info("No retitle needed or no type could be inferred.");
              return;
            }

            await github.rest.pulls.update({ ...context.repo, pull_number, title });
            core.notice(`Retitled PR from "${pr.title}" to "${title}"`);

  check:
    name: Semantic title
    needs: retitle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      # Fetches the current title from the API, so it sees the retitle above.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # semantic-release's angular preset header; it doesn't parse "feat!:".
          headerPattern: '^(\w*)(?:\((.*)\))?: (.*)$'
          headerPatternCorrespondence: type, scope, subject
          # Keep in sync with TYPES in .github/scripts/semantic_pr_title.js.
          types: |
            build
            ci
            docs
            feat
            fix
            perf
            refactor
            test
            revert
            chore
