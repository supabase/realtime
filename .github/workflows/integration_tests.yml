name: Integration Tests
on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "config/**"
      - "priv/**"
      - "!priv/repo/tenant_schema/**"
      - "assets/**"
      - "rel/**"
      - "mix.exs"
      - "mix.lock"
      - "Dockerfile"
      - "run.sh"
      - "docker-compose.test.yml"
      - ".github/workflows/integration_tests.yml"

  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.postgres }})
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      POSTGRES_IMAGE: ${{ matrix.postgres_image }}
    strategy:
      fail-fast: false
      matrix:
        postgres: [pg14, pg15, pg15_latest, pg17, orioledb17]
        include:
          - postgres: pg14
            postgres_image: supabase/postgres:14.1.0.82
          # test before supautils.policy_grants added all necessary grants
          - postgres: pg15
            postgres_image: supabase/postgres:15.1.0.1
          - postgres: pg15_latest
            postgres_image: supabase/postgres:15.14.1.167
          - postgres: pg17
            postgres_image: supabase/postgres:17.6.1.166
          - postgres: orioledb17
            postgres_image: supabase/postgres:17.9.0.019-orioledb

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run integration test
        run: docker compose -f compose.tests.yml up --abort-on-container-exit --exit-code-from test-runner
