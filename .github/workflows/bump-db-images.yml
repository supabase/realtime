name: Bump DB images

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    name: Bump DB images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Bump images
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/bump_db_images.sh > "$RUNNER_TEMP/changes.md"

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_MANAGER_ID }}
          private-key: ${{ secrets.GH_APP_MANAGER_PRIVATE_KEY }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(ci): bump DB images"
          title: "chore(ci): bump DB images"
          body-path: ${{ runner.temp }}/changes.md
          branch: gha/bump-db-images
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
