name: Flaky Test Digest

# Drains whatever flaky-*.jsonl artifacts tests.yml's "Run tests" step has
# uploaded, groups occurrences by file:line, sends at most one Slack message
# per workday, then deletes the artifacts it just reported on. 
# Should catch up on a failed run.

on:
  schedule:
    - cron: "0 8 * * 1-5" # 08:00 UTC
  workflow_dispatch: {}

permissions:
  actions: write # write (not just read) is required to delete artifacts

jobs:
  collect:
    name: Collect and report flaky events
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      has_flaky: ${{ steps.aggregate.outputs.has_flaky }}
      blocks: ${{ steps.aggregate.outputs.blocks }}
    steps:
      - name: List and download outstanding flaky artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p flaky-artifacts
          : > matched_artifacts.jsonl

          # Repo-wide `.../actions/artifacts` returns every artifact ever
          # created, including coverage-partition-* (which this workflow
          # never deletes) - so paginating that directly would still mean
          # scanning up to 90 days of history every run, deletion or not.
          # Scope to runs instead: list tests.yml runs from a generous fixed
          # lookback then each run's own small list.
          SINCE="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          RUN_IDS="$(gh run list --repo "${{ github.repository }}" --workflow=tests.yml \
            --created ">=${SINCE}" -L 1000 --json databaseId --jq '.[].databaseId')"

          for RUN_ID in $RUN_IDS; do
            gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              | jq -c '.artifacts[] | select(.expired == false) | select(.name | startswith("flaky-"))' \
              >> matched_artifacts.jsonl
          done

          jq -r '.id' matched_artifacts.jsonl > artifact_ids.txt || true

          if [ ! -s matched_artifacts.jsonl ]; then
            echo "No outstanding flaky artifacts"
            exit 0
          fi

          while read -r ARTIFACT_ID; do
            curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o "flaky-artifacts/${ARTIFACT_ID}.zip"
            unzip -o -q "flaky-artifacts/${ARTIFACT_ID}.zip" -d "flaky-artifacts/${ARTIFACT_ID}"
          done < artifact_ids.txt

      - name: Aggregate by file:line and build Slack blocks
        id: aggregate
        run: |
          set -euo pipefail

          find flaky-artifacts -name 'flaky-events.jsonl' -exec cat {} + > all_events.jsonl 2>/dev/null || true

          if [ ! -s all_events.jsonl ]; then
            echo "has_flaky=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Builds one Slack section block per distinct file:line (instead of one giant string)
          # so a snippet truncation can only ever clip that one entry, never the whole message,
          # and so markdown (*bold*, links) isn't nested inside an outer code fence that disables
          # it.
          #
          # postgres/partition/job_url may be absent from previous runs or `job_url` failures
          # - every use below tolerates that via `// ""`/`// empty`.
          BLOCKS_JSON="$(jq -sc --argjson max_entries 20 --argjson max_job_links 5 '
            def truncate_at_line($budget):
              if (. | length) <= $budget then .
              else
                .[0:$budget] as $cut
                | ($cut | rindex("\n")) as $idx
                | (if $idx then $cut[0:$idx] else $cut end) + "\n… (truncated)"
              end;

            # Distinct Postgres versions a group occurred on (partition does not matter)
            def pg_versions:
              map(.postgres // "")
              | map(select(. != ""))
              | unique;

            # Up to $n most recent distinct job URLs to find patterns
            def recent_job_urls($n):
              map(select((.job_url // "") != ""))
              | sort_by(.run_id | tonumber? // 0)
              | reverse
              | reduce .[] as $e ([]; if any(.[]; . == $e.job_url) then . else . + [$e.job_url] end)
              | .[0:$n];

            # `killed` events (test processes being force killed) carry no assertion or stacktrace,
            # so their snippet is always the same unreadable one-liner.
            # Collapse all of them into a single block instead of letting each
            # distinct test form its own entry.
            (group_by(if (.kind // "assertion") == "killed" then "__killed__"
                       elif (.file // "") != "" then (.file + ":" + (.line|tostring))
                       else .test end)
             | map(
                 . as $events
                 | ($events[0]) as $first
                 | ($events | sort_by(.run_id | tonumber? // 0) | last) as $latest
                 | if ($first.kind // "assertion") == "killed" then
                     {
                       key: "__killed__",
                       kind: "killed",
                       count: ($events | length),
                       tests: ($events | map(.test) | unique | sort),
                       job_urls: ($events | recent_job_urls($max_job_links)),
                       envs: ($events | pg_versions)
                     }
                   else
                     {
                       key: (if ($first.file // "") != "" then ($first.file + ":" + ($first.line|tostring)) else $first.test end),
                       kind: "assertion",
                       count: ($events | length),
                       test: $first.test,
                       snippet: ($latest.snippet // ""),
                       job_urls: ($events | recent_job_urls($max_job_links)),
                       envs: ($events | pg_versions)
                     }
                   end
               )
             | sort_by(-.count)
            ) as $groups
            | ($groups | length) as $total_groups
            | ($groups | map(.count) | add) as $total_occurrences
            # The killed group is one entry in $groups but bundles many distinct tests -
            # expand it back out so the headline count is not off by however many tests got
            # collapsed into that one block.
            | ($groups | map(if .kind == "killed" then (.tests | length) else 1 end) | add) as $total_distinct_tests
            | ($groups[0:$max_entries]) as $shown
            | (
                [
                  { type: "section", text: { type: "mrkdwn",
                      text: "*\($total_distinct_tests) distinct flaky test(s), \($total_occurrences) total occurrence(s) today*" } }
                ]
                + ($shown | map(
                    . as $g
                    | (if ($g.envs | length) > 0 then "  _(seen on: \($g.envs | join(", ")))_" else "" end) as $envs_suffix
                    | (if ($g.job_urls | length) > 0 then
                        "Logs: " + ($g.job_urls | to_entries | map("<\(.value)|\(.key + 1)>") | join(" ")) + " · "
                      else "" end) as $link_prefix
                    | if $g.kind == "killed" then
                        # No snippet worth showing - just the test list, same char-budget
                        # safeguard as the assertion branch below.
                        ("*Test process killed* — \($g.count)x across \($g.tests | length) test(s)\($envs_suffix)\n\($link_prefix)") as $overhead
                        | ([50, 2900 - ($overhead | length)] | max) as $budget
                        | ($g.tests | join(", ") | truncate_at_line($budget)) as $tests
                        | {
                            type: "section",
                            text: { type: "mrkdwn",
                              text: "\($overhead)\($tests)" }
                          }
                      else
                        # Slack rejects the whole message if the text in any one section exceeds
                        # 3000 chars, so size the snippet budget off the fixed overhead of this
                        # block (not a flat guess) - a long test/key/env list must not push the total over.
                        ("*\($g.key)* — \($g.count)x\($envs_suffix)\n\($link_prefix)\($g.test)\n```\n\n```") as $overhead
                        | ([50, 2900 - ($overhead | length)] | max) as $budget
                        | ($g.snippet | truncate_at_line($budget)) as $snippet
                        | {
                            type: "section",
                            text: { type: "mrkdwn",
                              text: "*\($g.key)* — \($g.count)x\($envs_suffix)\n\($link_prefix)\($g.test)\n```\n\($snippet)\n```" }
                          }
                      end
                  ))
                + (if $total_groups > $max_entries then
                    [{ type: "context", elements: [ { type: "mrkdwn",
                        text: "…and \($total_groups - $max_entries) more distinct flaky test location(s) today." } ] }]
                  else [] end)
              )
          ' all_events.jsonl)"

          echo "has_flaky=true" >> "$GITHUB_OUTPUT"
          echo "blocks=$BLOCKS_JSON" >> "$GITHUB_OUTPUT"

      - name: Delete reported-on artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -s artifact_ids.txt ] || exit 0

          while read -r ARTIFACT_ID; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}" || true
          done < artifact_ids.txt

  notify:
    name: Notify Slack
    needs: collect
    if: ${{ needs.collect.outputs.has_flaky == 'true' }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      title: "Daily flaky test digest"
      status: "partial"
      details_blocks: ${{ needs.collect.outputs.blocks }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
