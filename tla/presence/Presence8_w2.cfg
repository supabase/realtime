\* Witness: snapshots from one sender can overtake each other. The probe
\* says no in-flight message is older than the receiver's mark for its
\* sender. With MaxDelay = 1 two snapshots from one incarnation are in
\* flight together and the newer lands first, so the older is a stale
\* message behind it. The mark makes the receiver ignore it; without the
\* mark the replica would go backwards for a period. Threshold 3 keeps
\* MaxDelay + 1 < SilenceThreshold.
\* The probe also fails at MaxDelay = 0, through a different route: Stop,
\* Start, Stop with no tick between puts goodbyes from two incarnations in
\* flight at once. Run with MaxDelay = 0 and threshold 2 to see that trace.
\* Expected result: NoStaleInFlight VIOLATED.
SPECIFICATION PresenceSpec
INVARIANT TypeOK
INVARIANT NoStaleInFlight

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxStarts = 2
CONSTANT SilenceThreshold = 3
CONSTANT MaxDelay = 1
CONSTANT PurgeEnabled = TRUE
CONSTANT BoundedLoss = FALSE
CONSTANT MaxDrops = 0
CONSTANT MaxSubscribes = 0
CONSTANT SubscribeFirst = TRUE
