\* Witness: the state message must be sent after the client is subscribed
\* for changes, not before. With the order reversed, a change that lands
\* between the state read and the subscription is in neither the state
\* message nor any diff, and the client never hears of it.
\* Expected result: ClientViewsAreCorrect VIOLATED. The shortest trace is
\* Start, Sync of an empty view, Track, Subscribe, Consume: the client holds
\* nothing while the node holds one ref. TLC with several workers may report
\* a longer interleaving of the same failure.
SPECIFICATION PresenceSpec
INVARIANT TypeOK
INVARIANT ClientViewsAreCorrect
INVARIANT MarkedReplicaIsCurrent

CONSTRAINT InboxBounded

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxStarts = 2
CONSTANT SilenceThreshold = 2
CONSTANT MaxDelay = 0
CONSTANT PurgeEnabled = TRUE
CONSTANT BoundedLoss = FALSE
CONSTANT MaxDrops = 0
CONSTANT MaxSubscribes = 1
CONSTANT SubscribeFirst = FALSE
CONSTANT RequestsEnabled = TRUE
