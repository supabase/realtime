\* Probe: a live tracker is never declared dead. Expected result:
\* FalsePositivesUnreachable VIOLATED. Drop has no fairness, so a peer's
\* heartbeats can be lost SilenceThreshold times in a row. The trace is the
\* shape of a false positive; see the comment on the definition.
SPECIFICATION PresenceSpec
INVARIANT FalsePositivesUnreachable

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxJoins = 2
CONSTANT SilenceThreshold = 2
CONSTANT PurgeEnabled = TRUE
