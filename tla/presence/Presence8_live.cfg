\* Liveness with the client switched off. The default config needs a state
\* constraint on inbox length, and TLC's liveness results are unreliable
\* under a constraint. With MaxSubscribes = 0 no client ever subscribes, the
\* inbox never grows, no constraint is needed, and the tracker's liveness
\* properties can be checked here.
\*
\* MaxStarts is 1 here, unlike the default config. The liveness pass is
\* single-threaded and grows with the state count times the fairness
\* tableau; per-kind fairness tripled the tableau, and at MaxStarts = 2 the
\* two properties take 34 minutes and 65 minutes checked one at a time.
\* Both hold there; see the step 8 notes. Restart behaviour is covered by
\* the invariants in the default config and by the w2 probe.
\* Expected result: PairRepair and DeadStatesArePurged HOLD, about 15 min.
SPECIFICATION PresenceSpec
INVARIANT TypeOK
INVARIANT MarkedReplicaIsCurrent
INVARIANT NoTrackerNoState
PROPERTY PairRepair
PROPERTY DeadStatesArePurged

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxStarts = 1
CONSTANT SilenceThreshold = 2
CONSTANT MaxDelay = 0
CONSTANT PurgeEnabled = TRUE
CONSTANT BoundedLoss = FALSE
CONSTANT MaxDrops = 0
CONSTANT MaxSubscribes = 0
CONSTANT SubscribeFirst = TRUE
CONSTANT RequestsEnabled = TRUE
