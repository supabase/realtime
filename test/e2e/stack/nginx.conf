# Stands in for the Kong gateway of a Supabase project: one URL, routed by path prefix the same way
# Kong routes a project's /auth/v1, /rest/v1 and /realtime/v1.
events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 8000;

    location /auth/v1/ {
      proxy_pass http://auth:9999/;
    }

    location /rest/v1/ {
      proxy_pass http://rest:3000/;
    }

    # Realtime takes the tenant from the first label of the Host header.
    location /realtime/v1/api/ {
      proxy_pass http://realtime:4000/api/;
      proxy_set_header Host realtime-dev;
    }

    location /realtime/v1/ {
      proxy_pass http://realtime:4000/socket/;
      proxy_set_header Host realtime-dev;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }
  }
}
