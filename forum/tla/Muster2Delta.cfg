\* Delta-vs-full snapshot selection on top of the multi-group B1 model. Two groups
\* with DIVERGING ring orders (group "a" -> min, "b" -> max), so a third node
\* joining can re-route a group onto a router that is ALREADY a member -- the
\* delta case. Checks NoMissedDelivery holds for every group with the faithful
\* add-only delta apply + wholesale per-source seq guard.
SPECIFICATION Spec
CONSTANTS
  Nodes = {1, 2, 3}
  Groups = {"a", "b"}
  MaxSeq = 2
  RingRank <- RingDiverge3
INVARIANT TypeOK
INVARIANT NoMissedDelivery
