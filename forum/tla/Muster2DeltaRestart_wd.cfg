\* Non-vacuity witness: expect VIOLATION of NoDeltaWithRestart, proving a DELTA
\* snapshot genuinely rides alongside a restart (of its source or destination) in
\* the search -- i.e. the restart x delta interaction is actually reached, not
\* just restart x full. Needs MaxSeq=4 (deltas first appear there).
SPECIFICATION Spec
CONSTANTS
  Nodes = {1, 2, 3}
  Groups = {"a", "b"}
  MaxSeq = 4
  RingRank <- RingDiverge3
CONSTRAINT MsgBound
INVARIANT NoDeltaWithRestart
