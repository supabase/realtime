\* Sweep x delta x restart, SWEEP-covering partial: the MaxSeq=2 exhaustive
\* baseline is sweep-vacuous (see _w1.cfg -- in this model snapshot emission is
\* bound to Commit and costs a seq, so the sweep first fires at MaxSeq=3).
\* No MsgBound: this is the loosest sweep-covering search.
SPECIFICATION Spec
CONSTANTS
  Nodes = {1, 2, 3}
  Groups = {"a", "b"}
  MaxSeq = 3
  RingRank <- RingDiverge3
INVARIANT NoMissedDelivery
