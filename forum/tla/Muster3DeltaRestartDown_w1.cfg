\* Non-vacuity probe: expect VIOLATED (a DropStale sweep actually fires in the
\* multi-group composition). NOTE: at MaxSeq=2 the sweep is UNREACHABLE here
\* (NoSweepEver holds exhaustively) -- unlike the single-group Muster3 models,
\* this model binds snapshot emission to Commit, so a commit that re-routes a
\* held group costs a seq; join + discover + such a commit exceeds a 2-seq
\* budget. The sweep first fires at MaxSeq=3, so the MaxSeq=2 exhaustive
\* baseline is sweep-vacuous and the sweep-covering safety runs are the
\* MaxSeq=3/4 partials.
SPECIFICATION Spec
CONSTANTS
  Nodes = {1, 2, 3}
  Groups = {"a", "b"}
  MaxSeq = 3
  RingRank <- RingDiverge3
INVARIANT NoSweepEver
