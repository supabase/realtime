\* Deeper 4-node bounded search over the B1 fix, SHUFFLED ring (node 3 top),
\* |msgs|<=3 (looser than Muster2Bounded's <=2). Bounded => cannot PROVE, only
\* surface a shallow 4-node violation. Non-vacuity shown by the _w1/_w2/_w3 probes.
SPECIFICATION Spec
CONSTANTS
  Nodes = {1, 2, 3, 4}
  MaxSeq = 2
  RingRank <- RingShuf4
CONSTRAINT MsgBound
INVARIANT TypeOK
INVARIANT NoMissedDelivery
