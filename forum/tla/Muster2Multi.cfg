\* Caveat-2 multi-group: two groups with DIVERGING ring orders (group "a" routes
\* to min, group "b" to max), on top of the B1 two-phase view-adoption fix.
\* Checks NoMissedDelivery holds for EVERY group simultaneously.
SPECIFICATION Spec
CONSTANTS
  Nodes = {1, 2, 3}
  Groups = {"a", "b"}
  MaxSeq = 2
  RingRank <- RingDiverge3
INVARIANT TypeOK
INVARIANT NoMissedDelivery
