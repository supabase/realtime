\* Non-vacuity witness W1: expect VIOLATION of NoDeltaSent, proving the add-only
\* DELTA branch of the selection actually fires. Needs MaxSeq=4: with consistent-
\* hashing rings, GROWTH can only move a group onto a newly-added node (always a
\* FULL), so a delta requires a >=3-node SHRINK that promotes an existing member --
\* a deep scenario (first delta at BFS depth 10). At MaxSeq<=3 no delta is ever
\* sent, so the exhaustive MaxSeq=2 safety run is the NON-delta baseline and the
\* MaxSeq=4 partial run (Muster2Delta_s4.cfg) is what covers the delta path.
SPECIFICATION Spec
CONSTANTS
  Nodes = {1, 2, 3}
  Groups = {"a", "b"}
  MaxSeq = 4
  RingRank <- RingDiverge3
INVARIANT NoDeltaSent
