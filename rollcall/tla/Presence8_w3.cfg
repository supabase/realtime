\* Witness: diffs alone cannot repair a link. With requests switched off, a
\* receiver that misses one message is behind for ever: every later diff
\* from the sender is a gap, nothing obliges the sender ever to choose a
\* snapshot, and delivery fairness is satisfied by the diffs that keep
\* arriving. This is why the request path exists.
\* Expected result: PairRepair VIOLATED, a loop with one peer's behind flag
\* set and never cleared.
SPECIFICATION PresenceSpec
INVARIANT TypeOK
PROPERTY PairRepair

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxStarts = 1
CONSTANT SilenceThreshold = 2
CONSTANT MaxDelay = 0
CONSTANT PurgeEnabled = TRUE
CONSTANT BoundedLoss = FALSE
CONSTANT MaxDrops = 0
CONSTANT MaxSubscribes = 0
CONSTANT SubscribeFirst = TRUE
CONSTANT RequestsEnabled = FALSE
