\* Stabilisation under bounded loss: the network drops at most MaxDrops
\* messages in total, modelling one that eventually stops losing. Once the
\* drops are exhausted, the system must settle and stay settled. Same
\* constants as the step 5 stable config, client off, requests on.
\* Expected result: Convergence, Stabilisation and DeadStatesArePurged HOLD.
SPECIFICATION PresenceSpec
INVARIANT TypeOK
PROPERTY Convergence
PROPERTY Stabilisation
PROPERTY DeadStatesArePurged

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxStarts = 1
CONSTANT SilenceThreshold = 2
CONSTANT MaxDelay = 0
CONSTANT PurgeEnabled = TRUE
CONSTANT BoundedLoss = TRUE
CONSTANT MaxDrops = 2
CONSTANT MaxSubscribes = 0
CONSTANT SubscribeFirst = TRUE
CONSTANT RequestsEnabled = TRUE
