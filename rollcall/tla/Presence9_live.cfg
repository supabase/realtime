\* Liveness with the client switched off, as in the step 8 live config.
\* With MaxSubscribes = 0 no client ever subscribes, no state constraint is
\* needed, and the tracker's liveness properties can be checked here.
\* MaxStarts is 1 for the same reason as step 8: the liveness pass is
\* single-threaded and grows with the state count times the fairness
\* tableau.
\* Expected result: PairRepair and DeadStatesArePurged HOLD.
SPECIFICATION PresenceSpec
INVARIANT TypeOK
INVARIANT MarkedReplicaIsCurrent
INVARIANT NoTrackerNoState
INVARIANT StaysInStep
PROPERTY PairRepair
PROPERTY DeadStatesArePurged

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxStarts = 1
CONSTANT SilenceThreshold = 2
CONSTANT MaxDelay = 0
CONSTANT PurgeEnabled = TRUE
CONSTANT BoundedLoss = FALSE
CONSTANT MaxDrops = 0
CONSTANT MaxSubscribes = 0
CONSTANT SubscribeFirst = TRUE
CONSTANT RequestsEnabled = TRUE
CONSTANT TargetedSnapshots = TRUE
