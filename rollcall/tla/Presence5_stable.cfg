\* Stabilisation under bounded loss: the network drops at most MaxDrops
\* messages in total, modelling one that eventually stops losing. Once the
\* drops are exhausted, the system must settle and stay settled.
\* Expected result: Stabilisation and Convergence both HOLD.
SPECIFICATION PresenceSpec
INVARIANT TypeOK
PROPERTY Convergence
PROPERTY Stabilisation
PROPERTY DeadStatesArePurged

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxJoins = 2
CONSTANT SilenceThreshold = 2
CONSTANT MaxDelay = 0
CONSTANT PurgeEnabled = TRUE
CONSTANT BoundedLoss = TRUE
CONSTANT MaxDrops = 2
