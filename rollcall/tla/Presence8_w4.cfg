\* Witness: the request path is needed even on a network that eventually
\* stops losing. The stable config with requests switched off: one lost
\* message before the drops run out leaves a receiver behind, and after the
\* last drop the sender can still choose diffs for ever, so the system never
\* settles. Unbounded loss cannot make this point, since there a sender
\* choosing diffs for ever is indistinguishable from loss.
\* Expected result: Stabilisation VIOLATED.
SPECIFICATION PresenceSpec
INVARIANT TypeOK
PROPERTY Stabilisation

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxStarts = 1
CONSTANT SilenceThreshold = 2
CONSTANT MaxDelay = 0
CONSTANT PurgeEnabled = TRUE
CONSTANT BoundedLoss = TRUE
CONSTANT MaxDrops = 2
CONSTANT MaxSubscribes = 0
CONSTANT SubscribeFirst = TRUE
CONSTANT RequestsEnabled = FALSE
