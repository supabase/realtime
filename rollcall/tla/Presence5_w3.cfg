\* Witness for cluster-wide repair under unbounded loss. Convergence asks
\* for every link to be correct at the same instant, infinitely often.
\* Expected result: VIOLATED. Loss alternates between the two directions,
\* so whenever one link is restored the other has just been purged. Each
\* link still repairs on its own (PairRepair, checked in Presence5.cfg).
SPECIFICATION PresenceSpec
PROPERTY Convergence

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxJoins = 2
CONSTANT SilenceThreshold = 2
CONSTANT MaxDelay = 0
CONSTANT PurgeEnabled = TRUE
CONSTANT BoundedLoss = FALSE
CONSTANT MaxDrops = 0
