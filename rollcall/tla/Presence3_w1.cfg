\* Witness for the periodic heartbeat: with PeriodicHeartbeat = FALSE a node
\* heartbeats only after a local change. One dropped heartbeat then leaves a
\* replica stale forever, because nothing sends it again.
\* Expected result: Convergence VIOLATED.
\* Deadlock checking is off: with send-on-change, a quiescent state has no
\* enabled action, and that is not the failure this witness is about.
SPECIFICATION PresenceSpec
PROPERTY Convergence
CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT UniqueRefs = TRUE
CONSTANT PeriodicHeartbeat = FALSE
