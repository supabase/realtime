\* Probe for the departed-node gap: a live tracker can hold entries for a
\* tracker that has stopped, because the departed node's last heartbeat can
\* land after it leaves and nothing ever corrects it. Step 5 (dead detection)
\* is where this becomes a property that holds.
\* Expected result: LiveTrackersDontCarryDeadTrackersState VIOLATED.
SPECIFICATION PresenceSpec
INVARIANT LiveTrackersDontCarryDeadTrackersState

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxJoins = 2
