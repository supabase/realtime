\* Witness: without the targeted snapshot a requester can go behind again
\* after a reply. The reply is at the version at reply time. The next diff
\* starts from sent, the version at the last heartbeat. A change between
\* the heartbeat and the reply, and one more before the next heartbeat,
\* make that diff a gap at the requester. This is the step 8 design. The
\* network loses nothing, so no loss explains the second gap.
\* Expected result: StaysInStep VIOLATED. The shortest trace is 16 states:
\* both start, n2 is behind on its first diff from n1 and requests, n1
\* tracks, replies at version 1 and untracks, and the next diff from n1
\* (from 0, stamp 2) leaves n2 behind again. TLC with several workers may
\* report a longer interleaving of the same failure.
SPECIFICATION PresenceSpec
INVARIANT TypeOK
INVARIANT StaysInStep

CHECK_DEADLOCK FALSE

CONSTANT Nodes = {n1, n2}
CONSTANT Refs = {r1, r2}
CONSTANT MaxStarts = 1
CONSTANT SilenceThreshold = 2
CONSTANT MaxDelay = 0
CONSTANT PurgeEnabled = TRUE
CONSTANT BoundedLoss = TRUE
CONSTANT MaxDrops = 0
CONSTANT MaxSubscribes = 0
CONSTANT SubscribeFirst = TRUE
CONSTANT RequestsEnabled = TRUE
CONSTANT TargetedSnapshots = FALSE
